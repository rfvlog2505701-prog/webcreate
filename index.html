<!DOCTYPE html>
<html lang="bn" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudHost - Secure Cloud Server & Web Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cloudBlue: '#0066ff',
                        skyBg: '#f0f6ff',
                    }
                }
            }
        }
    </script>
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA1xamm1F6qzEAT1TEfNMpF6xD8HYJsNVo",
            authDomain: "testfirebase-872d3.firebaseapp.com",
            databaseURL: "https://testfirebase-872d3-default-rtdb.firebaseio.com",
            projectId: "testfirebase-872d3",
            storageBucket: "testfirebase-872d3.firebasestorage.app",
            messagingSenderId: "70746254150",
            appId: "1:70746254150:web:348b30cf428dd6d9449347"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'dashboard.html';
            }
        });

        window.handleAuth = async function(isLogin) {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const msg = document.getElementById('authMsg');

            if(!email || !pass) {
                msg.innerText = "দয়া করে ইমেইল ও পাসওয়ার্ড দিন!";
                return;
            }

            try {
                if(isLogin) {
                    await signInWithEmailAndPassword(auth, email, pass);
                } else {
                    await createUserWithEmailAndPassword(auth, email, pass);
                }
                window.location.href = 'dashboard.html';
            } catch (error) {
                msg.innerText = "ত্রুটি: " + error.message;
            }
        }
    </script>
</head>
<body class="bg-skyBg text-slate-800 font-sans">

    <!-- Navbar -->
    <nav class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <div class="bg-blue-600 text-white p-2 rounded-xl shadow-lg shadow-blue-500/30">
                <i class="fa-solid fa-cloud text-xl"></i>
            </div>
            <span class="text-xl font-bold bg-gradient-to-r from-blue-600 to-cyan-500 bg-clip-text text-transparent">CloudHost</span>
        </div>
        <div>
            <a href="#authSection" class="px-5 py-2.5 bg-blue-600 text-white rounded-xl font-medium shadow-md shadow-blue-500/20 hover:bg-blue-700 transition">লগইন / রেজিস্টার</a>
        </div>
    </nav>

    <!-- Hero Section (Inspired by your image layout) -->
    <header class="max-w-5xl mx-auto text-center py-16 px-4">
        <div class="inline-block px-4 py-1.5 bg-blue-100 text-blue-700 rounded-full text-xs font-semibold mb-4">
            🚀 Secure Cloud Server For Your Business
        </div>
        <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight text-slate-900 mb-6">
            Instant Cloud Web Hosting & <span class="text-blue-600">Single-File Builder</span>
        </h1>
        <p class="text-slate-600 max-w-2xl mx-auto text-base md:text-lg mb-10">
            নিমিষেই আপনার কোড দিয়ে ওয়েবসাইট লাইভ করুন, ফেভিকন যুক্ত করুন এবং API ব্যবহার করে অটোমেট করুন।
        </p>

        <!-- Auth Box -->
        <div id="authSection" class="max-w-md mx-auto bg-white p-8 rounded-3xl shadow-xl border border-blue-100 text-left">
            <h3 class="text-xl font-bold text-slate-900 mb-4 text-center">আপনার অ্যাকাউন্টে প্রবেশ করুন</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">ইমেইল এড্রেস</label>
                    <input type="email5" id="email" placeholder="user@example.com" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">পাসওয়ার্ড</label>
                    <input type="password" id="password" placeholder="••••••••" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 text-sm">
                </div>
                <div class="flex space-x-3 pt-2">
                    <button onclick="handleAuth(true)" class="flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm transition shadow-md shadow-blue-500/20">লগইন</button>
                    <button onclick="handleAuth(false)" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-sm transition">রেজিস্টার</button>
                </div>
                <p id="authMsg" class="text-xs text-rose-500 text-center font-medium mt-2"></p>
            </div>
        </div>
    </header>

</body>
</html>
