<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লোড হচ্ছে...</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA1xamm1F6qzEAT1TEfNMpF6xD8HYJsNVo",
            authDomain: "testfirebase-872d3.firebaseapp.com",
            databaseURL: "https://testfirebase-872d3-default-rtdb.firebaseio.com",
            projectId: "testfirebase-872d3",
            storageBucket: "testfirebase-872d3.firebasestorage.app",
            messagingSenderId: "70746254150",
            appId: "1:70746254150:web:348b30cf428dd6d9449347"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        let username = urlParams.get('user');

        async function loadSite() {
            if (!username) {
                document.body.innerHTML = "<h2 style='text-align:center;margin-top:20vh;font-family:sans-serif;color:red;'>❌ কোনো ইউজারনেম দেওয়া হয়নি!</h2>";
                return;
            }

            try {
                const snapshot = await get(child(ref(db), `users/${username.toLowerCase()}`));
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    
                    if(data.favicon) {
                        let link = document.querySelector("link[rel*='icon']") || document.createElement('link');
                        link.type = 'image/x-icon';
                        link.rel = 'shortcut icon';
                        link.href = data.favicon;
                        document.getElementsByTagName('head')[0].appendChild(link);
                    }

                    document.open();
                    document.write(data.code);
                    document.close();
                } else {
                    document.body.innerHTML = `<h2 style='text-align:center;margin-top:20vh;font-family:sans-serif;color:orange;'>⚠️ "${username}" নামের কোনো সাইট ডেটাবেজে পাওয়া যায়নি!</h2>`;
                }
            } catch (err) {
                document.body.innerHTML = "<h2 style='text-align:center;margin-top:20vh;font-family:sans-serif;color:red;'>⚠️ ডেটাবেজ সংযোগে সমস্যা হয়েছে!</h2>";
            }
        }
        loadSite();
    </script>
</head>
<body style="background:#0f172a; color:#fff; display:flex; justify-content:center; align-items:center; height:100vh; font-family:sans-serif;">
    <h3>ওয়েবসাইট লোড হচ্ছে...</h3>
</body>
</html>
