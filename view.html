<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লোড হচ্ছে...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-white flex items-center justify-center h-screen m-0 overflow-hidden">
    
    <div id="loading" class="text-center font-sans space-y-3">
        <div class="inline-block p-4 bg-cyan-500/10 border border-cyan-500/20 rounded-full animate-bounce">
            <i class="fa-solid fa-globe text-cyan-400 text-3xl"></i>
        </div>
        <p class="text-cyan-400 text-base font-medium tracking-wide animate-pulse">ওয়েবসাইট লোড হচ্ছে...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA1xamm1F6qzEAT1TEfNMpF6xD8HYJsNVo",
            authDomain: "testfirebase-872d3.firebaseapp.com",
            databaseURL: "https://testfirebase-872d3-default-rtdb.firebaseio.com",
            projectId: "testfirebase-872d3",
            storageBucket: "testfirebase-872d3.firebasestorage.app",
            messagingSenderId: "70746254150",
            appId: "1:70746254150:web:348b30cf428dd6d9449347",
            measurementId: "G-PV17LVJRJK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ইউজারনেম বের করা
        const urlParams = new URLSearchParams(window.location.search);
        let username = urlParams.get('user');

        if (!username) {
            const pathSegments = window.location.pathname.split('/').filter(Boolean);
            if (pathSegments.length > 0) {
                username = pathSegments[0];
            }
        }

        async function loadUserSite() {
            if (!username) {
                renderError("❌ কোনো ইউজারনেম পাওয়া যায়নি!", "দয়া করে সঠিক লিংকে প্রবেশ করুন।");
                return;
            }

            try {
                const dbRef = ref(db);
                const snapshot = await get(child(dbRef, `users/${username.toLowerCase()}`));

                if (snapshot.exists()) {
                    const userData = snapshot.val();
                    document.open();
                    document.write(userData.code);
                    document.close();
                } else {
                    renderError("⚠️ ওয়েবসাইট পাওয়া যায়নি!", `"${username}" নামের কোনো ওয়েবসাইট এই সিস্টেমে রেজিস্টার্ড নেই।`);
                }
            } catch (error) {
                console.error(error);
                renderError("⚠️ সংযোগ ত্রুটি!", "ডেটাবেজ থেকে ডেটা আনতে সমস্যা হয়েছে। ইন্টারনেট কানেকশন চেক করুন।");
            }
        }

        function renderError(title, subtitle) {
            document.body.innerHTML = `
                <div class="max-w-md mx-auto p-8 text-center bg-slate-900/80 backdrop-blur-xl border border-rose-500/20 rounded-3xl shadow-2xl m-4">
                    <div class="inline-flex p-4 bg-rose-500/10 text-rose-400 rounded-2xl mb-4 text-2xl">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                    </div>
                    <h2 class="text-xl font-bold text-rose-400 mb-2">${title}</h2>
                    <p class="text-slate-400 text-sm mb-6">${subtitle}</p>
                    <a href="/" class="inline-block px-6 py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl text-sm font-semibold transition shadow-lg shadow-cyan-600/20">হোম পেজে ফিরে যান</a>
                </div>
            `;
        }

        loadUserSite();
    </script>
</body>
</html>
