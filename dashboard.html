<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudHost - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA1xamm1F6qzEAT1TEfNMpF6xD8HYJsNVo",
            authDomain: "testfirebase-872d3.firebaseapp.com",
            databaseURL: "https://testfirebase-872d3-default-rtdb.firebaseio.com",
            projectId: "testfirebase-872d3",
            storageBucket: "testfirebase-872d3.firebasestorage.app",
            messagingSenderId: "70746254150",
            appId: "1:70746254150:web:348b30cf428dd6d9449347"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUser = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('userEmailDisplay').innerText = user.email;
            } else {
                window.location.href = 'index.html';
            }
        });

        window.logout = function() {
            signOut(auth).then(() => { window.location.href = 'index.html'; });
        }

        window.handleFaviconUpload = function(event) {
            const file = event.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('faviconBase64').value = e.target.result;
                    document.getElementById('faviconPreview').src = e.target.result;
                    document.getElementById('faviconPreview').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        window.saveWebsite = async function() {
            if(!currentUser) return;
            let subDomain = document.getElementById('subdomain').value.trim().toLowerCase();
            const htmlCode = document.getElementById('htmlCode').value;
            const favicon = document.getElementById('faviconBase64').value;
            const msg = document.getElementById('saveMsg');

            if(!subDomain || !htmlCode) {
                msg.innerText = "দয়া করে ইউজারনেম এবং HTML কোড দিন!";
                msg.className = "text-xs text-rose-500 font-medium";
                return;
            }

            subDomain = subDomain.replace(/[^a-z0-9-_]/g, '');

            try {
                await set(ref(db, 'users/' + subDomain), {
                    uid: currentUser.uid,
                    code: htmlCode,
                    favicon: favicon,
                    updatedAt: Date.now()
                });

                // পারফেক্ট ও কাজ করার মতো কুয়েরি স্ট্রিং লিংক
                const siteUrl = `${window.location.origin}/view.html?user=${subDomain}`;
                msg.innerHTML = `সফলভাবে সেভ হয়েছে! <a href="${siteUrl}" target="_blank" class="text-blue-600 underline font-bold">এখানে ক্লিক করে সাইট দেখুন</a>`;
                msg.className = "text-xs text-emerald-600 font-medium mt-2 block";
            } catch (error) {
                msg.innerText = "ত্রুটি: " + error.message;
                msg.className = "text-xs text-rose-500 font-medium mt-2 block";
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col justify-between p-6">
        <div>
            <div class="flex items-center space-x-2 mb-10">
                <div class="bg-blue-600 text-white p-2 rounded-xl">
                    <i class="fa-solid fa-cloud text-lg"></i>
                </div>
                <span class="text-lg font-bold text-slate-900">CloudHost</span>
            </div>
        </div>
        <div>
            <div class="mb-4 p-3 bg-slate-50 rounded-xl border border-slate-100">
                <p class="text-[10px] text-slate-400 uppercase font-bold">লগইন আছেন:</p>
                <p id="userEmailDisplay" class="text-xs font-semibold text-slate-700 truncate">loading...</p>
            </div>
            <button onclick="logout()" class="w-full py-2.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl text-sm font-semibold transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-right-from-bracket"></i> <span>লগআউট</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-8 max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold text-slate-900 mb-2">ওয়েব বিল্ডার ও কোড আপডেট</h1>
        <p class="text-slate-500 text-sm mb-6">আপনার ইউজারনেম ও কোড দিয়ে মুহূর্তেই সাইট লাইভ করুন।</p>

        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">ইউজারনেম</label>
                <input type="text" id="subdomain" placeholder="eg. ridowan" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 text-sm font-mono">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">কাস্টম ফেভিকন (Optional)</label>
                <input type="file" accept="image/*" onchange="handleFaviconUpload(event)" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700">
                <input type="hidden" id="faviconBase64">
                <img id="faviconPreview" class="w-8 h-8 mt-2 rounded-md hidden border border-slate-200">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">HTML কোড</label>
                <textarea id="htmlCode" rows="10" placeholder="<!DOCTYPE html>..." class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 font-mono text-xs text-slate-700"></textarea>
            </div>

            <button onclick="saveWebsite()" class="py-3 px-6 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm transition shadow-md shadow-blue-500/20">
                পাবলিশ / আপডেট করুন
            </button>
            <div id="saveMsg"></div>
        </div>
    </main>

</body>
</html>
